<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeoCast</title>
<style>
:root{--bg:#16171b;--panel:#1c1d23;--line:rgba(255,255,255,.13);--text:#f2f3f5;--dim:#8d909a;--blue:#8fb0ff;--btn:#aac4ff;--violet:#c9a8ff;--green:#4cd964;--red:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:var(--text);
 background:radial-gradient(900px 520px at 0% 100%,rgba(96,48,130,.38),transparent 70%),radial-gradient(700px 400px at 100% 0%,rgba(40,60,120,.25),transparent 70%),var(--bg);
 display:grid;grid-template-columns:300px 1fr;min-height:100vh}
main{height:100vh;overflow:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
/* sidebar */
aside{background:rgba(10,10,14,.45);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 14px 0;height:100vh;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:14px;padding:0 10px 28px;font-size:20px;font-weight:600}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2aa0ff,#1565e8);display:grid;place-items:center;font-size:22px;color:#fff}
.sec{font-size:13px;letter-spacing:.14em;color:var(--dim);padding:0 10px 12px;font-weight:600}
#recent{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.rc{display:flex;gap:12px;padding:10px 12px;border-radius:14px;text-align:left;width:100%;align-items:center}
.rc:hover{background:rgba(255,255,255,.05)}.rc.on{background:rgba(255,255,255,.1)}
.th{width:58px;height:38px;border-radius:6px;background:#2a2c36 center/cover;flex:none;display:grid;place-items:center;font-size:18px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.rc div.t{min-width:0;flex:1}
.rc b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc small{display:block;color:var(--dim);font-size:13px;margin:2px 0 6px}
.pb{height:3px;border-radius:2px;background:rgba(255,255,255,.14)}.pb i{display:block;height:100%;border-radius:2px;background:#3d85ff}
.empty{color:var(--dim);font-size:14px;padding:6px 12px}
.foot{border-top:1px solid var(--line);padding:18px 10px;display:flex;align-items:center;gap:10px;color:#bfc2cb;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim)}.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.bad{background:var(--red)}
.foot button{margin-left:auto;font-size:20px;color:var(--dim)}.foot button:hover{color:var(--text)}
/* main */
main{padding:30px 40px 36px;display:flex;flex-direction:column;gap:26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:flex;align-items:center;gap:10px;padding:11px 18px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);font-size:16px;font-weight:500}
.pill svg{font-size:20px}
.drop{flex:1;min-height:190px;border:2px dashed #4b4e5a;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;transition:.15s}
.drop.over{border-color:var(--blue);background:rgba(143,176,255,.07)}
.up{width:54px;height:68px;border:2px solid #7a7d89;border-radius:12px;display:grid;place-items:center;font-size:30px;color:#c9ccd6;margin-bottom:18px}
.drop h1{margin:0 0 10px;font-size:34px;letter-spacing:-.02em;font-weight:700}
.drop p{margin:0 0 22px;max-width:560px;color:var(--dim);font-size:18px;line-height:1.55}
.cta{background:var(--btn);color:#10286a;font-weight:600;font-size:19px;padding:15px 36px;border-radius:999px;box-shadow:0 8px 30px rgba(143,176,255,.3)}
.cta:hover{filter:brightness(1.07)}
.alt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.alt input{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;width:230px}
.ghost{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;color:#c4c7d0}.ghost:hover{background:rgba(255,255,255,.07)}
.busy{width:min(460px,100%);margin-top:6px}.busy .pb{height:6px;margin-top:12px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{border:1px solid var(--line);border-radius:24px;padding:24px;text-align:left;background:rgba(255,255,255,.025);min-height:164px;display:flex;flex-direction:column;gap:8px}
.card:hover{background:rgba(255,255,255,.05)}.card.dis{opacity:.55;pointer-events:none}
.card svg,.card .ic{font-size:28px;height:30px;margin-bottom:8px}
.card .k{letter-spacing:.14em;font-size:14px;color:var(--dim);font-weight:600}
.card .v{font-size:20px;font-weight:600;line-height:1.3}.card .v span{font-size:16px;color:var(--dim);font-weight:400}
.bars{display:flex;gap:4px;align-items:center;height:30px;margin-bottom:8px;color:var(--green)}.bars i{width:5px;border-radius:3px;background:currentColor}
/* player */
.player{display:flex;align-items:center;gap:20px;padding:14px 26px 14px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(28,29,35,.9)}
.player.dis{opacity:.6}.player.dis button,.player.dis input{pointer-events:none}
.pth{width:80px;height:80px;border-radius:50%;background:#2a2c36 center/cover;flex:none;overflow:hidden;display:grid;place-items:center;font-size:26px}
.pth img{width:100%;height:100%;object-fit:cover}
.skip{font-size:17px;font-weight:600;color:#d5d8e0;width:44px}
.big{width:66px;height:66px;border-radius:50%;background:#fff;color:#16171b;display:grid;place-items:center;font-size:28px;flex:none}
.tm{font-size:17px;color:#a9acb6;font-variant-numeric:tabular-nums;min-width:62px}
input[type=range]{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--blue) var(--p,0%),rgba(255,255,255,.2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(143,176,255,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}
.cc{font-weight:700;font-size:16px;color:#7a7d89}.cc.on{color:var(--violet)}
.stop{width:16px;height:16px;border-radius:3px;background:#d5d8e0;margin-left:4px}
/* popover + modal + toast */
#menu{position:fixed;z-index:30;background:#24262e;border:1px solid var(--line);border-radius:14px;padding:6px;min-width:220px;max-height:60vh;overflow:auto;box-shadow:0 16px 50px rgba(0,0,0,.5);display:none}
#menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:15px}
#menu button:hover{background:rgba(255,255,255,.08)}#menu small{color:var(--dim)}#menu .sel{color:var(--blue)}
dialog{border:1px solid var(--line);border-radius:22px;background:#202228;color:var(--text);width:min(620px,92vw);padding:24px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 14px}dialog input,dialog textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 14px;font:inherit}
dialog textarea{height:90px;margin:10px 0}
#list{max-height:46vh;overflow:auto;margin:12px 0}
#list button{display:flex;justify-content:space-between;width:100%;padding:10px 12px;border-radius:10px;text-align:left;gap:12px}
#list button:hover{background:rgba(255,255,255,.07)}#list small{color:var(--dim);white-space:nowrap}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#3a1d22;border:1px solid #7a3039;color:#ffd5d8;padding:12px 20px;border-radius:14px;max-width:80vw;display:none;z-index:40}
@media(max-height:860px){.up{display:none}}
@media(max-width:900px){body{grid-template-columns:1fr}aside{height:auto;position:static;max-height:300px;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 16px;height:auto}.cards{grid-template-columns:1fr}.player{flex-wrap:wrap;border-radius:28px}.drop h1{font-size:26px}}
</style></head><body>
<aside>
 <div class="brand"><div class="logo"><svg style="stroke:#fff" viewBox="0 0 24 24"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path class="f" d="m12 15 5 6H7Z" style="fill:#fff"/></svg></div>NeoCast</div>
 <div class="sec">RECENT MEDIA</div>
 <div id="recent"></div>
 <div class="foot"><span class="dot" id="dot"></span><span id="ftxt">Starting…</span>
  <button onclick="openSettings()" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button></div>
</aside>
<main>
 <div class="top">
  <div class="pill" id="lan"><svg viewBox="0 0 24 24" class="f"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>Local Network</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="pill" id="cache" onclick="clearCache()" title="Delete converted files, downloads and thumbnails">Clear cache</button>
  <button class="pill" id="dev" onclick="devMenu(this)"><svg viewBox="0 0 24 24"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path class="f" d="m12 15 5 6H7Z"/></svg><span id="devn">Apple TV</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div>
 </div>
 <div class="drop" id="drop"></div>
 <div class="cards">
  <button class="card dis" id="cSub" onclick="subMenu(this)"></button>
  <button class="card dis" id="cAud" onclick="audMenu(this)"></button>
  <div class="card dis" id="cStr"></div>
 </div>
 <div class="player dis" id="player">
  <div class="pth" id="pth">🎬</div>
  <button class="skip" onclick="skip(-15)">−15</button>
  <button class="big" id="pp" onclick="pauseBtn()"></button>
  <button class="skip" onclick="skip(15)">+15</button>
  <span class="tm" id="cur">0:00</span>
  <input type="range" id="sl" min="0" max="100" value="0">
  <span class="tm" id="tot">0:00</span>
  <button class="cc" id="cc" onclick="toggleCC()">CC</button>
  <button class="stop" onclick="stopBtn()" title="Stop"></button>
 </div>
</main>
<div id="menu"></div><div id="toast"></div>
<dialog id="pick"><h3>Select video</h3>
 <input id="q" placeholder="Search your library folders" oninput="renderList()">
 <div id="list"></div>
 <div class="row"><button class="ghost" onclick="browse()">Browse files…</button><button class="ghost" onclick="pick.close()">Close</button></div></dialog>
<dialog id="set"><h3>Settings</h3>
 <input id="host" placeholder="Apple TV IP (blank = auto-discover)">
 <textarea id="libs" placeholder="One library folder per line"></textarea>
 <div class="row"><button class="ghost" onclick="set.close()">Cancel</button><button class="cta" style="padding:10px 26px;font-size:16px" onclick="saveSettings()">Save &amp; rescan</button></div></dialog>
<script>
const $=s=>document.querySelector(s), I={pause:'<svg class="f" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>',play:'<svg class="f" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>'};
let S={status:'idle',jobs:[],missing:[]},file=null,T=null,sel={on:false,sub:null,audio:0},drag=false,LIB=[],ticks=0,lastStatus='';
async function api(p,b){const r=await fetch(p,b!==undefined?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});return r.json()}
const fmt=t=>{t=Math.max(0,Math.floor(t||0));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const ago=t=>{const s=Date.now()/1000-t;return s<3600?Math.max(1,Math.round(s/60))+'m ago':s<86400?Math.round(s/3600)+'h ago':s<172800?'yesterday':Math.round(s/86400)+'d ago'};
const gb=b=>b>=1e9?(b/1e9).toFixed(1)+' GB':Math.round(b/1e6)+' MB';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',6000)}
function menu(el,items){const m=$('#menu');m.innerHTML='';items.forEach(([label,fn,on,sub])=>{const b=document.createElement('button');b.className=on?'sel':'';b.innerHTML=esc(label)+(sub?' <small>'+esc(sub)+'</small>':'');b.onclick=()=>{m.style.display='none';fn()};m.append(b)});
 const r=el.getBoundingClientRect();m.style.display='block';m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-12)+'px';m.style.top=Math.min(r.bottom+8,innerHeight-m.offsetHeight-12)+'px'}
addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('.card,.pill,.cc'))$('#menu').style.display='none'},true);

/* sidebar */
async function loadRecent(){const R=await api('/api/recent'),el=$('#recent');el.innerHTML='';
 if(!R.length)el.innerHTML='<div class="empty">Nothing played yet.</div>';
 R.forEach(x=>{const b=document.createElement('button');b.className='rc'+(file&&file.id===x.id?' on':'');
  const playing=S.cur===x.id&&S.status==='playing',pct=x.dur?Math.min(100,x.pos/x.dur*100):0;
  b.innerHTML=`<div class="th"><img src="/api/thumb/${x.id}" onerror="this.replaceWith('🎬')"></div><div class="t"><b>${esc(x.name)}</b><small>${playing?'now playing':ago(x.t)} · ${x.sub?esc(x.sub):gb(x.size)}</small><div class="pb"><i style="width:${pct}%"></i></div></div>`;
  b.onclick=()=>load(x.id,x.name);el.append(b)})}

/* drop zone */
function dropHTML(){const j=S.jobs[S.jobs.length-1],busy=j&&!['done','error'].includes(j.stage);
 if(busy){const lbl={queued:'Queued',checking:'Checking file',downloading:'Downloading',converting:'Converting to 720p / 30fps',starting:'Starting on Apple TV'}[j.stage]||j.stage;
  return `<div class="up">⏳</div><h1>${lbl}…</h1><p>${esc(j.title)}</p><div class="busy"><div class="pb"><i style="width:${Math.max(j.pct||0,4)}%"></i></div></div>`}
 if(file)return `<div class="up"><svg viewBox="0 0 24 24" class="f"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg></div><h1>${esc(file.name)}</h1><p>${T?esc(T.summary):'Reading file…'}</p>
  <div class="row" style="justify-content:center"><button class="cta" onclick="play(false)">${file.resume>30?'Resume '+fmt(file.resume):'Play'}</button>${file.resume>30?'<button class="ghost" onclick="play(true)">Restart</button>':''}<button class="ghost" onclick="openPick()">Change</button></div>`;
 return `<div class="up"><svg viewBox="0 0 24 24" style="font-size:30px"><path d="M12 17V8m-4 4 4-4 4 4"/></svg></div><h1>Drop a video to play</h1><p>Drag any MKV, MP4 or AVI from your file manager. It is converted to 720p / 30fps if the Apple TV needs it, then streamed.</p>
  <button class="cta" onclick="openPick()">Select Video</button>
  <div class="alt"><input id="yt" placeholder="Paste a YouTube link" onkeydown="if(event.key==='Enter')yt()"><button class="ghost" onclick="yt()">Play link</button>
  <button class="ghost" onclick="go('live')">Live audio (experimental)</button><button class="ghost" onclick="go('screen')">Share screen (experimental)</button></div>`}
function drawDrop(){const h=dropHTML();if(h!==drawDrop.last){drawDrop.last=h;$('#drop').innerHTML=h}}   // only redraw on change so typing in the link box survives
const dz=$('#drop');
['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',async ev=>{const f=ev.dataTransfer.files[0];if(!f)return;const r=await api('/api/match',{name:f.name,size:f.size});
 if(r.id)load(r.id,r.name);else{toast('Browsers hide file locations. Pick it from the list, or use Browse files.');openPick()}});

/* file selection + cards */
async function load(id,name){file={id,name,resume:0};T=null;sel={on:false,sub:null,audio:0};drawDrop();drawCards();
 const t=await api('/api/tracks/'+id);if(!file||file.id!==id)return;
 if(!t.ok){toast(t.error||'Could not read file');file=null;drawDrop();return}
 T=t;file.resume=t.resume;const en=t.subs.find(s=>s.text&&(s.lang==='eng'||s.lang==='en'||s.lang==='ext'))||t.subs.find(s=>s.text);sel.sub=en?en.i:null;
 drawDrop();drawCards();loadRecent()}
function subLabel(s){return s.lang==='ext'?'external '+s.title:[s.lang,s.title].filter(Boolean).join(' · ')}
function drawCards(){const on=!!T;
 const cs=$('#cSub'),ca=$('#cAud'),st=$('#cStr');[cs,ca,st].forEach(c=>c.classList.toggle('dis',!on));
 const subs=T?T.subs:[],cur=subs.find(s=>s.i===sel.sub);
 cs.innerHTML=`<svg viewBox="0 0 24 24" style="color:var(--violet)"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 11h4M13 11h4M7 15h2M12 15h5"/></svg><div class="k">SUBTITLES</div><div class="v">${sel.on&&cur?esc(subLabel(cur)):'Off'} <span>· ${subs.length} track${subs.length===1?'':'s'} found${T&&!T.burn_ok&&subs.length?' (ffmpeg lacks libass)':''}</span></div>`;
 const au=T?T.audios:[],ac=au.find(a=>a.i===sel.audio);
 ca.innerHTML=`<div class="bars"><i style="height:14px"></i><i style="height:26px"></i><i style="height:18px"></i><i style="height:8px"></i></div><div class="k">AUDIO</div><div class="v">${ac&&sel.audio?esc([ac.lang,ac.title,ac.codec].filter(Boolean).join(' · ')):'Original'} <span>· ${au.length||1} track${au.length>1?'s':''}</span></div>`;
 st.innerHTML=`<svg viewBox="0 0 24 24" class="f" style="color:var(--blue)"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg><div class="k">STREAM</div><div class="v">${T?(T.direct&&!sel.on&&!sel.audio?'Direct play':'Convert first'):'—'} <span>· ${T?esc(T.video):'720p · 30fps max'}</span></div>`}
function subMenu(el){if(!T)return;menu(el,[['Off',()=>{sel.on=false;drawCards();resub()},!sel.on],...T.subs.map(s=>[subLabel(s),()=>{if(!s.text)return toast('Image-based subtitles cannot be burned in.');sel.on=true;sel.sub=s.i;drawCards();resub()},sel.on&&sel.sub===s.i,s.text?s.codec:'image'])])}
function audMenu(el){if(!T||T.audios.length<2)return toast('Only one audio track.');menu(el,T.audios.map(a=>[[a.lang,a.title,a.codec,a.ch?a.ch+'ch':''].filter(Boolean).join(' · '),()=>{sel.audio=a.i;drawCards();resub()},sel.audio===a.i]))}
function toggleCC(){if(!T||!T.subs.length)return toast('No subtitle tracks.');if(sel.sub===null)sel.sub=T.subs.find(s=>s.text)?.i??null;if(sel.sub===null)return toast('No text subtitles to burn in.');sel.on=!sel.on;drawCards();resub()}
function resub(){if(S.status==='playing'&&file&&S.cur===file.id)play(false,S.position)}   // re-encode from the current position

/* actions */
async function play(restart,at){if(!file)return;const c=T&&T.subs.find(s=>s.i===sel.sub);
 const r=await api('/api/play',{id:file.id,restart,at,sub:sel.on?sel.sub:null,label:sel.on&&c?(c.lang+' subs'):null,audio:sel.audio});if(!r.ok)toast(r.error)}
async function yt(){const u=$('#yt').value.trim();if(u){file=null;T=null;drawCards();await api('/api/youtube',{url:u})}}
async function go(k){file=null;T=null;drawCards();await api('/api/'+k,{device:null})}
async function pauseBtn(){const r=await api('/api/pause',{});if(!r.ok)toast(r.error)}
async function skip(d){const r=await api('/api/seek',{delta:d});if(!r.ok)toast(r.error)}
async function stopBtn(){await api('/api/stop',{})}
const sl=$('#sl');sl.addEventListener('pointerdown',()=>drag=true);
sl.addEventListener('input',()=>{$('#cur').textContent=fmt(sl.value);sl.style.setProperty('--p',sl.value/sl.max*100+'%')});
sl.addEventListener('change',async()=>{drag=false;const r=await api('/api/seek',{position:+sl.value});if(!r.ok)toast(r.error)});

/* picker / settings / devices */
async function openPick(){$('#pick').showModal();LIB=await api('/api/library');renderList()}
function renderList(){const q=$('#q').value.toLowerCase(),el=$('#list');el.innerHTML='';
 LIB.filter(x=>x.name.toLowerCase().includes(q)).slice(0,200).forEach(x=>{const b=document.createElement('button');b.innerHTML=`<span>${x.audio?'♫ ':''}${esc(x.name)}</span><small>${gb(x.mb*1e6)}</small>`;b.onclick=()=>{$('#pick').close();load(x.id,x.name)};el.append(b)});
 if(!el.children.length)el.innerHTML='<div class="empty">No matches. Add folders in Settings or use Browse files.</div>'}
async function browse(){const r=await api('/api/pick',{});if(r.id){$('#pick').close();load(r.id,r.name)}else if(r.error)toast(r.error)}
async function openSettings(){const c=await api('/api/settings');$('#host').value=c.host||'';$('#libs').value=(c.library||[]).join('\n');$('#set').showModal()}
async function saveSettings(){await api('/api/settings',{host:$('#host').value,library:$('#libs').value.split('\n')});$('#set').close();toast.h&&0;LIB=[]}
async function devMenu(el){menu(el,[['Scanning…',()=>{}]]);const D=await api('/api/devices');
 menu(el,[...D.map(d=>[d.name,async()=>{await api('/api/host',{host:d.ip,name:d.name})},S.host===d.ip,d.ip]),['Auto-discover',async()=>{await api('/api/host',{host:'',name:''})},!S.host],...(D.length?[]:[['No Apple TV found — set the IP in Settings',()=>openSettings()]])])}

/* cache */
async function cacheLabel(){const c=await api('/api/cache');$('#cache').textContent='Clear cache · '+gb(c.bytes)}
async function clearCache(){if(!confirm('Delete all converted files, downloads and thumbnails? They will be rebuilt when needed.'))return;
 const r=await api('/api/cache/clear',{});if(!r.ok)toast(r.error);else{toast('Freed '+gb(r.freed));loadRecent()}cacheLabel()}

/* status loop */
async function tick(){let s;try{s=await api('/api/status')}catch(e){$('#ftxt').textContent='NeoCast server not reachable';$('#dot').className='dot bad';return}
 S=s;const play_=s.status==='playing',conn=s.status==='connecting';
 $('#devn').textContent=s.device_name||s.host||'Auto-discover';$('#lan').title='This PC: '+(s.lan||'?')+':'+s.media_port;
 $('#dot').className='dot '+(s.status==='error'?'bad':play_||conn?'ok':'');
 $('#ftxt').textContent=s.missing.length?'Install ffmpeg (missing: '+s.missing.join(', ')+')':s.status==='error'?'Error — see message':(s.device_name||s.device||s.host||'Apple TV')+(play_?' playing':conn?' connecting':' ready');
 const pl=$('#player');pl.classList.toggle('dis',!play_);$('#pp').innerHTML=s.paused?I.play:I.pause;
 $('#cc').classList.toggle('on',sel.on);$('#tot').textContent=fmt(s.duration);
 if(!drag){$('#cur').textContent=fmt(s.position);sl.max=s.duration||100;sl.value=s.position;sl.style.setProperty('--p',(s.duration?s.position/s.duration*100:0)+'%')}
 const p=$('#pth');if(s.cur&&play_&&p.dataset.id!==s.cur){p.dataset.id=s.cur;p.innerHTML=`<img src="/api/thumb/${s.cur}" onerror="this.replaceWith('🎬')">`}
 if(s.error&&s.error!==tick.err){toast(s.error)}tick.err=s.error;
 const j=s.jobs[s.jobs.length-1];if(j&&j.error&&j.error!==tick.jerr)toast(j.error);tick.jerr=j&&j.error;
 const key=s.status+'|'+(j&&j.stage);if(key!==lastStatus){lastStatus=key;loadRecent()}drawDrop();ticks++}
$('#dot').className='dot';drawCards();$('#pp').innerHTML=I.pause;
setInterval(tick,1000);tick();loadRecent();cacheLabel();setInterval(cacheLabel,15000);
</script></body></html>
